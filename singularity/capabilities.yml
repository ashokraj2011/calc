version: 1

# Capability policy is inherited from the single root toward each child.
# Missing values inherit. Empty allowlists mean deny-all; required obligations
# such as checks and protected paths are accumulated.
capabilities:
  calc-app:
    name: CaLC
    kind: delivery
    parent: null
    repository: calc
    jira:
      projectKey: PAY
    teams:
      - PZN
  rule-engine:
    name: RuleEngine
    kind: delivery
    parent: null
    repository: ruleengine
